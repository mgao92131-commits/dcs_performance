[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcs-performance"
version = "0.1.0"
description = "Rule-based performance assessment foundation for DCS operations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
dcs-performance = "dcs_performance.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"dcs_performance.rules.example_rule" = ["config.json", "README.md"]
"dcs_performance.rules.persistent_high_alarm" = ["config.json", "README.md"]
"dcs_performance.rules.analog_trend_stability" = ["config.json", "README.md"]
"dcs_performance.rules.analog_limit_exceedance" = ["config.json", "README.md"]
"dcs_performance.rules.pump_flow_compliance" = ["config.json", "README.md"]
"dcs_performance.rules.level_rate_compliance" = ["config.json", "README.md"]
"dcs_performance.rules.flow_balance_compliance" = ["config.json", "README.md"]
"dcs_performance.shifts" = ["*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
